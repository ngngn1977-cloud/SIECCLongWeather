name: R-CMD-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: {extra-packages: any::rcmdcheck}
      - run: R CMD build .
      - run: R CMD check --no-manual SIECCLongWeather_*.tar.gz
      - run: Rscript -e 'library(SIECCLongWeather); stopifnot(run_demo()$DEMO_REPRODUCTION=="PASS")'
      - run: Rscript -e 'library(SIECCLongWeather); x<-reproduce_statistics(write_outputs=FALSE); stopifnot(x$PUBLICATION_REPRODUCTION=="PASS")'
      - run: Rscript scripts/run_repository_scans.R
