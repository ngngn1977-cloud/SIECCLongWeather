name: R-CMD-check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # a suggested package that cannot be installed must not fail the check
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (graphics devices, fonts, compression, TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpng-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libfribidi-dev libxml2-dev libssl-dev libcurl4-openssl-dev zlib1g-dev libzip-dev
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          dependencies: '"all"'
      - name: Build
        run: R CMD build .
      - name: Check
        run: R CMD check --no-manual SIECCLongWeather_*.tar.gz
      - name: Install the built package (R CMD check installs only into its own library)
        run: R CMD INSTALL SIECCLongWeather_*.tar.gz
      - name: Demo
        run: |
          Rscript -e 'library(SIECCLongWeather); r <- tryCatch(run_demo(output_dir = file.path(tempdir(), "siecc_demo")), error = function(e) { message("DEMO ERROR: ", conditionMessage(e)); quit(status = 1) }); print(r$DEMO_REPRODUCTION); stopifnot(identical(r$DEMO_REPRODUCTION, "PASS"))'
      - name: Frozen statistical reproduction
        run: |
          Rscript -e 'library(SIECCLongWeather); x <- tryCatch(reproduce_statistics(output_dir = file.path(tempdir(), "siecc_stats"), write_outputs = FALSE), error = function(e) { message("REPRODUCTION ERROR: ", conditionMessage(e)); quit(status = 1) }); print(x$PUBLICATION_REPRODUCTION); stopifnot(identical(x$PUBLICATION_REPRODUCTION, "PASS"))'
      - name: Repository scans
        run: Rscript scripts/run_repository_scans.R .
